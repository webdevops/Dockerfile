schemaVersion: "2.0.0"

metadataTest:
  entrypoint: ["/entrypoint"]
  cmd: ["supervisord"]
  exposedPorts: ["9000"]
  envVars:
    - key: "LC_ALL"
      value: "C.UTF-8"
    - key: "LANG"
      value: "C.UTF-8"
    - key: "TERM"
      value: "xterm"
    - key: "DOCKER_CONF_HOME"
      value: "/opt/docker/"
    - key: "LOG_STDOUT"
      value: ""
    - key: "LOG_STDERR"
      value: ""
    - key: "APPLICATION_USER"
      value: "application"
    - key: "APPLICATION_GROUP"
      value: "application"
    - key: "APPLICATION_PATH"
      value: "/app"
    - key: "APPLICATION_UID"
      value: "1000"
    - key: "APPLICATION_GID"
      value: "1000"

fileExistenceTests:
  - name: 'provision: set php version variable script was deleted after execution'
    path: '/opt/docker/provision/bootstrap.d/10-php-init.sh'
    shouldExist: false
  - name: 'provision: set permission script was deleted after execution'
    path: '/opt/docker/provision/bootstrap.d/11-php-conf.sh'
    shouldExist: false
  - name: 'provision: cron installer was deleted after enabling the service'
    path: '/opt/docker/provision/service.d/cron.sh'
    shouldExist: false
  - name: 'provision: syslog installer was deleted after enabling the service'
    path: '/opt/docker/provision/service.d/syslog.sh'
    shouldExist: false
  - name: 'provision: fpm config was created'
    path: '/opt/docker/etc/php/fpm/php-fpm.conf'
    shouldExist: true
  - name: 'provision: fpm pool config was created'
    path: '/opt/docker/etc/php/fpm/pool.d/application.conf'
    shouldExist: true
  - name: 'entrypoint: fpm config builder exists'
    path: '/opt/docker/provision/entrypoint.d/20-php-fpm.sh'
    shouldExist: true
  - name: 'entrypoint: ini config builder exists'
    path: '/opt/docker/provision/entrypoint.d/20-php.sh'
    shouldExist: true
  - name: 'supervisor: fpm starter exists'
    path: '/opt/docker/etc/supervisor.d/php-fpm.conf'
    shouldExist: true
  - name: 'provision: dnsmasq installer is retained'
    path: '/opt/docker/provision/service.d/dnsmasq.sh'
    shouldExist: true
    permissions: '-rw-r--r--'
  - name: 'provision: postfix installer is retained'
    path: '/opt/docker/provision/service.d/postfix.sh'
    shouldExist: true
    permissions: '-rw-r--r--'
  - name: 'provision: ssh installer is retained'
    path: '/opt/docker/provision/service.d/ssh.sh'
    shouldExist: true
    permissions: '-rw-r--r--'
  - name: 'provision: add application user script was deleted after execution'
    path: '/opt/docker/provision/bootstrap.d/10-user-application.sh'
    shouldExist: false
  - name: 'provision: set permission script was deleted after execution'
    path: '/opt/docker/provision/bootstrap.d/20-app.sh'
    shouldExist: false
  - name: 'app folder exists and is owned by the application user'
    path: '/app'
    shouldExist: true
    permissions: 'drwxr-xr-x'
    uid: 1000
    gid: 1000

fileContentTests:
  - name: 'supervisor: syslog service is enabled'
    path: '/opt/docker/etc/supervisor.d/syslog.conf'
    expectedContents: ['autostart = true']
  - name: 'supervisor: cron service is enabled'
    path: '/opt/docker/etc/supervisor.d/cron.conf'
    expectedContents: ['autostart = true']

commandTests:
  - name: "zip"
    command: "which"
    args: ["zip"]
    expectedOutput: ["/usr/bin/zip"]
  - name: "unzip"
    command: "which"
    args: ["unzip"]
    expectedOutput: ["/usr/bin/unzip"]
  - name: "nslookup"
    command: "which"
    args: ["nslookup"]
    expectedOutput: ["/usr/bin/nslookup"]
  - name: "ssh"
    command: "which"
    args: ["ssh"]
    expectedOutput: ["/usr/bin/ssh"]
  - name: "rsync"
    command: "which"
    args: ["rsync"]
    expectedOutput: ["/usr/bin/rsync"]
  - name: "git"
    command: "which"
    args: ["git"]
    expectedOutput: ["/usr/bin/git"]
  - name: "patch"
    command: "which"
    args: ["patch"]
    expectedOutput: ["/usr/bin/patch"]
  - name: "PHP version is 8.1 or newer"
    command: "php"
    args: ["-v"]
    expectedOutput: ['PHP 8\.[1-9][0-9]*\.']
  - name: "fpm config test"
    command: "/usr/local/bin/php-fpm"
    args: ["-t"]
    expectedError: ["test is successful"]
  - name: "env variables are available in FPM"
    setup: [["/entrypoint", "/bin/bash"]]
    command: "/usr/local/bin/php-fpm"
    envVars:
      - key: "SOME_VAR"
        value: "someval"
    args: ["-i"]
    expectedOutput: ["SOME_VAR => someval"]
  - name: "imagemagick convert"
    command: "which"
    args: ["convert"]
    expectedOutput: ["/usr/bin/convert"]
  - name: "graphicsmagick"
    command: "which"
    args: ["gm"]
    expectedOutput: ["/usr/bin/gm"]
  - name: "ghostscript"
    command: "which"
    args: ["gs"]
    expectedOutput: ["/usr/bin/gs"]
  - name: "composer"
    command: "which"
    args: ["composer"]
    expectedOutput: ["/usr/local/bin/composer"]
  - name: "php modules"
    command: "php"
    args: ["-m"]
    expectedOutput: &phpModules
      - "amqp"
