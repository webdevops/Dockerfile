---
# Settings of ci/console generate:github-ci and generate:readme-banner

docker:
  # This tag is also published as latest
  autoLatestTag: 'ubuntu-22.04'
  # Deprecated image names that the CI also publishes an image under, only for the tags listed here.
  # webdevops/php-official is webdevops/php and gets no new tags, see docs/discontinued-images.md.
  aliases:
    php-official:
      image: 'php'
      tags: ['8.2', '8.2-alpine', '8.3', '8.3-alpine', '8.4', '8.4-alpine', '8.5', '8.5-alpine']

# Settings of the image tests (ci/console test:image), per image tag
dockerTest:
  configuration:
    imageConfigurationRegex: ':(?P<OS_FAMILY>alpine|debian|ubuntu|centos)-?(?P<OS_VERSION>[^-]+)?'
    default:
      OS_FAMILY: 'ubuntu'
      OS_VERSION: '22.04'
    image:
      'php[^:]*:[0-9].[0-9]-alpine$':
        OS_FAMILY: 'alpine'
        OS_VERSION: '3'
        PHP_OFFICIAL: '1'
      'php[^:]*:8.(0|1|2|3|4|5)':
        OS_FAMILY: 'debian'
        OS_VERSION: '12'
        PHP_OFFICIAL: '1'
      'php[^:]*:8.6$':
        OS_FAMILY: 'debian'
        OS_VERSION: '13'
        PHP_OFFICIAL: '1'
