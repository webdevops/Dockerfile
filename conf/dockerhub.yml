      docs: 'docs/discontinued-images.md#webdevopsstorage'
  typo3:
    lastBuilt: '2020-04'
  typo3-solr:
    lastBuilt: '2021-05'
  varnish:
    lastBuilt: '2020-07'
  vsftp:
    lastBuilt: '2026-11'
