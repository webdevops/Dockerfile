server {
    listen 80 default_server;
    # IPv6; the files are deleted at start if the container has no IPv6
    include /opt/docker/etc/nginx/vhost.ipv6/listen-80*.conf;

    server_name  _ <ALIAS_DOMAIN> docker;

    root "<DOCUMENT_ROOT>";
    index <DOCUMENT_INDEX>;

    include /opt/docker/etc/nginx/vhost.common.d/*.conf;
}

##############
# SSL
##############

server {
    listen 443 ssl default_server;
    # IPv6; the files are deleted at start if the container has no IPv6
    include /opt/docker/etc/nginx/vhost.ipv6/listen-443*.conf;

    server_name  _ <ALIAS_DOMAIN> docker;

    root "<DOCUMENT_ROOT>";
    index <DOCUMENT_INDEX>;

    include /opt/docker/etc/nginx/vhost.common.d/*.conf;
    include /opt/docker/etc/nginx/vhost.ssl.conf;
}
