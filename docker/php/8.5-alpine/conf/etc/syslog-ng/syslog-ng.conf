@version: 3.5

template t_isostamp {
    # syslog-t_isostamp START
    template("[SYSLOG] $MSGHDR$MSG\n");
    # syslog-t_isostamp END
};

options {
    # syslog-options START
    file-template(t_isostamp);
    chain_hostnames(off);
    flush_lines(0);
    use-dns(no);
    use_fqdn(no);
    owner("root");
    group("adm");
    perm(0640);
    stats_freq(0);
    # syslog-options START
};

source s_src {
    # syslog-s_src START
    # a datagram socket: syslog() of glibc tries datagrams first, the one of musl on Alpine only sends datagrams
    unix-dgram("/dev/log");
    internal();
    # syslog-s_src END
};

filter f_filter {
    # syslog-f_filter START
    not facility(auth, authpriv);
    # syslog-f_filter END
};

# messages up to the level warning go to stdout, errors to stderr, like the access and error logs of the services
filter f_stdout {
    level(debug..warning);
};

filter f_stderr {
    level(err..emerg);
};

# owner(), group() and perm() are empty: syslog-ng leaves the owner and mode of the pipe or file as they are
destination d_stdout {
    # syslog-d_stdout START
    pipe("/docker.stdout" owner() group() perm());
    # syslog-d_stdout END
};

destination d_stderr {
    # syslog-d_stderr START
    pipe("/docker.stderr" owner() group() perm());
    # syslog-d_stderr END
};

log {
    # syslog-log-stdout START
    source(s_src);
    filter(f_filter);
    filter(f_stdout);
    destination(d_stdout);
    # syslog-log-stdout END
};

log {
    # syslog-log-stderr START
    source(s_src);
    filter(f_filter);
    filter(f_stderr);
    destination(d_stderr);
    # syslog-log-stderr END
};
