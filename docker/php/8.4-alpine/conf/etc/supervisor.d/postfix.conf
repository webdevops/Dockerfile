[group:postfix]
programs=postfixd
priority=30

[program:postfixd]
directory = /etc/postfix
command = /opt/docker/bin/service.d/postfix.sh
process_name=%(program_name)s
; postfix.sh runs as long as Postfix does; if it ends sooner, Postfix did not start, and after startretries
; attempts supervisord gives up
startsecs = 5
autostart = false
autorestart = true
; the container log, or the files of LOG_STDOUT and LOG_STDERR
stdout_logfile=/docker.stdout
stdout_logfile_maxbytes=0
stderr_logfile=/docker.stderr
stderr_logfile_maxbytes=0
