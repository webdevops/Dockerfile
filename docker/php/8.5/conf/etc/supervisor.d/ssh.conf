[group:ssh]
programs=sshd
priority=30

[program:sshd]
command = /opt/docker/bin/service.d/ssh.sh
process_name=%(program_name)s
startsecs=0
autostart = false
autorestart = true
; the container log, or the files of LOG_STDOUT and LOG_STDERR
stdout_logfile=/docker.stdout
stdout_logfile_maxbytes=0
stderr_logfile=/docker.stderr
stderr_logfile_maxbytes=0
