# Starts the build as soon as the official PHP images have a new PHP release, instead of waiting for the nightly build.
# Every hour it compares PHP_VERSION of each official base image (the FROM line of docker/php-official/<tag>/Dockerfile)
# with PHP_VERSION of webdevops/php-official:<tag> and webdevops/php-nginx:<tag>. If one of them is older, it starts
# build.yaml on master, unless a build is already running or was started by this workflow in the last hours.
# A rebuild of the official images without a new PHP release (same PHP_VERSION) does not start a build; the nightly
# build picks that up.
name: php-upstream

'on':
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only report outdated tags, do not start a build'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: php-upstream
  cancel-in-progress: false

jobs:
  check:
    name: 'Compare PHP versions with the official images'
    runs-on: ubuntu-latest
    if: "${{ github.repository == 'webdevops/Dockerfile' }}"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Login to hub.docker.com'
        uses: docker/login-action@v4
        with:
          username: '${{ secrets.DOCKERHUB_USERNAME }}'
          password: '${{ secrets.DOCKERHUB_TOKEN }}'

      - name: 'Find tags whose PHP is older than the official image'
        id: compare
        run: |-
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }

          # PHP_VERSION of an image for linux/amd64, empty if the image cannot be read
          php_version() {
            skopeo inspect --retry-times 3 --override-os linux --override-arch amd64 \
              --format '{{range .Env}}{{println .}}{{end}}' "docker://docker.io/$1" 2>/dev/null \
              | sed -n 's/^PHP_VERSION=//p' | head -n1 || true
          }

          outdated=""
          for dockerfile in docker/php-official/*/Dockerfile; do
            tag=$(basename "$(dirname "$dockerfile")")
            upstream_image=$(sed -nE 's/^FROM[[:space:]]+([^[:space:]]+).*/\1/p' "$dockerfile" | head -n1)
            upstream=$(php_version "$upstream_image")
            if [ -z "$upstream" ]; then
              echo "::warning::Could not read PHP_VERSION of $upstream_image"
              continue
            fi
            for image in "webdevops/php-official:$tag" "webdevops/php-nginx:$tag"; do
              ours=$(php_version "$image")
              if [ "$ours" = "$upstream" ]; then
                echo "$image: PHP $ours, up to date with $upstream_image"
              else
                echo "::notice::$image has PHP ${ours:-?}, $upstream_image has PHP $upstream"
                outdated="$outdated $image"
              fi
            done
          done
          echo "outdated=${outdated# }" >> "$GITHUB_OUTPUT"

      - name: 'Start build.yaml on master'
        if: "${{ steps.compare.outputs.outdated != '' }}"
        env:
          GH_TOKEN: '${{ github.token }}'
          GH_REPO: '${{ github.repository }}'
          DRY_RUN: "${{ inputs.dry-run && 'true' || 'false' }}"
          # A build started by this workflow within this many hours blocks the next one, so that a failing build is
          # not started again every hour. The nightly build still runs.
          COOLDOWN_HOURS: 8
          OUTDATED: '${{ steps.compare.outputs.outdated }}'
        run: |-
          set -euo pipefail
          running=$(gh run list --workflow build.yaml --branch master --limit 20 --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          if [ "$running" != "0" ]; then
            echo "A build on master is already running or queued; the next check looks again."
            exit 0
          fi
          since=$(date -u -d "-${COOLDOWN_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh run list --workflow build.yaml --branch master --event workflow_dispatch --limit 20 \
            --json createdAt --jq "[.[] | select(.createdAt > \"$since\")] | length")
          if [ "$recent" != "0" ]; then
            echo "::warning::build.yaml was started by hand or by this workflow in the last ${COOLDOWN_HOURS} hours and the images are still outdated; not starting it again."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would start build.yaml on master for: $OUTDATED"
            exit 0
          fi
          gh workflow run build.yaml --ref master
          echo "::notice::Started build.yaml on master for: $OUTDATED"
