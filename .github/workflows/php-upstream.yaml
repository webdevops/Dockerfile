# Starts the build as soon as the official PHP images have a new PHP release, instead of waiting for the nightly build.
# Every hour it compares PHP_VERSION of each official base image (the FROM line of docker/php-official/<tag>/Dockerfile)
# with PHP_VERSION of webdevops/php-official:<tag> and webdevops/php-nginx:<tag>. If one of them is older or does not
# exist yet, it starts build.yaml on master, unless a build of master is already running, or a build that this
# workflow started in the last hours failed, or it already started several. An image that cannot be read is skipped.
# A rebuild of the official images without a new PHP release (same PHP_VERSION) does not start a build; the nightly
# build picks that up.
name: php-upstream

'on':
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only report outdated tags, do not start a build'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: php-upstream
  cancel-in-progress: false

jobs:
  check:
    name: 'Compare PHP versions with the official images'
    runs-on: ubuntu-latest
    if: "${{ github.repository == 'webdevops/Dockerfile' }}"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Login to hub.docker.com'
        env:
          DOCKERHUB_USERNAME: '${{ secrets.DOCKERHUB_USERNAME }}'
          DOCKERHUB_TOKEN: '${{ secrets.DOCKERHUB_TOKEN }}'
        run: |-
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
          printf '%s' "$DOCKERHUB_TOKEN" \
            | skopeo login --authfile "$RUNNER_TEMP/docker-hub-auth.json" --username "$DOCKERHUB_USERNAME" --password-stdin docker.io

      - name: 'Find tags whose PHP is older than the official image'
        id: compare
        run: |-
          set -euo pipefail
          skopeo_error="$RUNNER_TEMP/skopeo-error.txt"

          # Prints PHP_VERSION of the image for linux/amd64. Fails if the image cannot be read; skopeo's error is
          # then in $skopeo_error. --no-tags: skopeo would otherwise list every tag of the repository.
          php_version() {
            local image=$1
            local variables
            variables=$(skopeo inspect --authfile "$RUNNER_TEMP/docker-hub-auth.json" --no-tags --retry-times 3 \
              --override-os linux --override-arch amd64 \
              --format '{{range .Env}}{{println .}}{{end}}' "docker://docker.io/$image" 2>"$skopeo_error") || return 1
            sed -n '/^PHP_VERSION=/{s///p;q;}' <<<"$variables"
          }

          outdated=""
          for dockerfile in docker/php-official/*/Dockerfile; do
            tag=$(basename "$(dirname "$dockerfile")")
            upstream_image=$(sed -nE 's/^FROM[[:space:]]+([^[:space:]]+).*/\1/p' "$dockerfile" | head -n1)
            if ! upstream=$(php_version "$upstream_image"); then
              echo "::warning::Could not read $upstream_image, skipping $tag: $(tail -n1 "$skopeo_error")"
              continue
            elif [ -z "$upstream" ]; then
              echo "::warning::$upstream_image has no PHP_VERSION, skipping $tag"
              continue
            fi
            for image in "webdevops/php-official:$tag" "webdevops/php-nginx:$tag"; do
              if ! ours=$(php_version "$image"); then
                if grep -qi 'manifest unknown' "$skopeo_error"; then
                  # The tag does not exist yet, for example a new PHP version: build it
                  echo "::notice::$image does not exist yet, $upstream_image has PHP $upstream"
                  outdated="$outdated $image"
                else
                  echo "::warning::Could not read $image, skipping it: $(tail -n1 "$skopeo_error")"
                fi
              elif [ "$ours" = "$upstream" ]; then
                echo "$image: PHP $ours, up to date with $upstream_image"
              else
                echo "::notice::$image has PHP ${ours:-?}, $upstream_image has PHP $upstream"
                outdated="$outdated $image"
              fi
            done
          done
          echo "outdated=${outdated# }" >> "$GITHUB_OUTPUT"

      - name: 'Start build.yaml on master'
        if: "${{ steps.compare.outputs.outdated != '' }}"
        env:
          GH_TOKEN: '${{ github.token }}'
          GH_REPO: '${{ github.repository }}'
          DRY_RUN: "${{ inputs.dry-run && 'true' || 'false' }}"
          # Within this many hours, a build started by this workflow that did not succeed blocks the next one, so that
          # a failing build is not started again every hour; so do MAX_BUILDS builds started by it, in case a build
          # succeeds and still leaves an image outdated. The nightly build still runs.
          COOLDOWN_HOURS: 8
          MAX_BUILDS: 3
          OUTDATED: '${{ steps.compare.outputs.outdated }}'
        run: |-
          set -euo pipefail
          # --branch matches the head branch, so a pull request from the master branch of a fork would count as well
          running=$(gh run list --workflow build.yaml --branch master --limit 20 --json status,event \
            --jq '[.[] | select(.status != "completed" and .event != "pull_request")] | length')
          if [ "$running" != "0" ]; then
            echo "A build of master is already running or queued; the next check looks again."
            exit 0
          fi
          # Conclusions of the builds that this workflow started in the last COOLDOWN_HOURS: runs started with the
          # token of a run have the actor github-actions[bot]; builds started by hand do not count.
          since=$(date -u -d "-${COOLDOWN_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)
          conclusions=$(gh api "repos/$GH_REPO/actions/workflows/build.yaml/runs?branch=master&event=workflow_dispatch&per_page=20" \
            --jq "[.workflow_runs[] | select(.actor.login == \"github-actions[bot]\" and .created_at > \"$since\") | .conclusion]")
          failed=$(jq '[.[] | select(. != "success")] | length' <<<"$conclusions")
          started=$(jq 'length' <<<"$conclusions")
          if [ "$failed" != "0" ]; then
            echo "::warning::A build that this workflow started in the last ${COOLDOWN_HOURS} hours did not succeed; not starting another one."
            exit 0
          fi
          if [ "$started" -ge "$MAX_BUILDS" ]; then
            echo "::warning::This workflow started ${started} builds in the last ${COOLDOWN_HOURS} hours and images are still outdated; not starting another one."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would start build.yaml on master for: $OUTDATED"
            exit 0
          fi
          gh workflow run build.yaml --ref master
          echo "::notice::Started build.yaml on master for: $OUTDATED"
