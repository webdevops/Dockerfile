# TEMPORARY: runs the job "Update the Docker Hub pages" (a copy from build.yaml) for webdevops/php only, on every push to
# this branch, to check the Docker Hub token without a full build. Remove before merging.
name: dockerhub-pages-test
'on':
  push:
    branches:
      - fix/dockerhub-namespace-route
permissions:
  contents: read
jobs:
  dockerhub-description:
    name: 'Update the Docker Hub pages'
    if: "${{ github.repository == 'webdevops/Dockerfile' }}"
    runs-on: ubuntu-latest
    env:
      DOCKER_HUB_API: 'https://hub.docker.com/v2'
    steps:
      -
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      -
        name: 'Log in to Docker Hub'
        id: login
        shell: bash
        env:
          DOCKERHUB_USERNAME: '${{ secrets.DOCKERHUB_USERNAME }}'
          DOCKERHUB_TOKEN: '${{ secrets.DOCKERHUB_TOKEN }}'
        run: |-
          token=$(jq -n --arg identifier "$DOCKERHUB_USERNAME" --arg secret "$DOCKERHUB_TOKEN" '{identifier: $identifier, secret: $secret}' \
            | curl -sS --fail-with-body --retry 3 -H 'Content-Type: application/json' --data @- "$DOCKER_HUB_API/auth/token" \
            | jq -r '.access_token // empty')
          if [[ -z "$token" ]]; then echo "::error::Docker Hub returned no access token"; exit 1; fi
          echo "::add-mask::$token"
          echo "DOCKERHUB_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
      -
        name: 'Show the kind and scope of the token (no names, no e-mail)'
        if: "${{ !cancelled() && steps.login.outcome == 'success' }}"
        shell: bash
        run: |-
          t=$DOCKERHUB_ACCESS_TOKEN
          echo "token: ${#t} characters, $(awk -F. '{print NF}' <<<"$t") dot-separated parts, prefix ${t:0:5}"
          dec() { local x; x=$(tr '_-' '/+' <<<"$1"); while (( ${#x} % 4 )); do x+='='; done; base64 -d <<<"$x" 2>/dev/null; }
          IFS=. read -r h p _ <<<"$t"
          echo "header: $(dec "$h" | jq -c '{alg, typ}' 2>&1 | head -c 300)"
          echo "claims: $(dec "$p" | jq -c 'with_entries(.value |= type)' 2>&1 | head -c 600)"
          echo "hub claims: $(dec "$p" | jq -c '.["https://hub.docker.com"] // {} | with_entries(.value |= type)' 2>&1 | head -c 600)"
          echo "source type: $(dec "$p" | jq -c '{source_type: .source.type?, hub_source: .["https://hub.docker.com"].source, roles: .["https://hub.docker.com"].roles}' 2>&1 | head -c 300)"
          for path in namespaces/webdevops/repositories/php repositories/webdevops/php; do
            code=$(curl -sS -o "$RUNNER_TEMP/repo.json" -w '%{http_code}' -H "Authorization: Bearer $t" "$DOCKER_HUB_API/$path")
            echo "GET $path: HTTP $code $(jq -c '{permissions, namespace, name}' "$RUNNER_TEMP/repo.json" 2>/dev/null || tr -d "\n" < "$RUNNER_TEMP/repo.json" | head -c 200)"
          done
          echo "scope: $(dec "$p" | jq -c '.scope // .scp // .["https://hub.docker.com"].scope // null' 2>&1 | head -c 600)"
      -
        name: webdevops/php
        if: "${{ !cancelled() && steps.login.outcome == 'success' }}"
        shell: bash
        env:
          REPOSITORY: webdevops/php
          PAGE: docs/dockerhub/php.md
          SHORT_DESCRIPTION: 'PHP-FPM on the official PHP image, configured with environment variables; Debian and Alpine'
        run: |-
          status=$(jq -n --rawfile full_description "$PAGE" --arg description "$SHORT_DESCRIPTION" \
            '{full_description: $full_description, description: $description}' \
            | curl -sS --retry 3 -o "$RUNNER_TEMP/dockerhub-response.json" -w '%{http_code}' -X PATCH \
              -H 'Content-Type: application/json' -H "Authorization: Bearer $DOCKERHUB_ACCESS_TOKEN" \
              --data @- "$DOCKER_HUB_API/namespaces/${REPOSITORY%%/*}/repositories/${REPOSITORY#*/}")
          echo "Docker Hub answered $status"
          if [[ "$status" != 2* ]]; then
            echo "::error::Docker Hub answered $status for $REPOSITORY: $(head -c 2000 "$RUNNER_TEMP/dockerhub-response.json")"
            exit 1
          fi
