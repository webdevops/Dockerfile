      -
        name: 'Push arch image'
        if: "${{github.ref == 'refs/heads/master'}}"
        run: 'docker push "ghcr.io/webdevops/base-app:sha-${{ github.sha }}-${{ matrix.arch }}"-ubuntu-22.04'
      -
        name: 'Export image (OCI layout)'
