# TEMPORARY: on every push to this branch, tries every known way to change the description of webdevops/php on Docker
# Hub (.github/dockerhub-api-test.sh) with each pair of credentials: DOCKERHUB_USERNAME/DOCKERHUB_TOKEN and, if set,
# DOCKERHUB_USERNAME_TEST1/DOCKERHUB_TOKEN_TEST1 and DOCKERHUB_USERNAME_TEST2/DOCKERHUB_TOKEN_TEST2. The table is in the
# log and in the job summary. Remove before merging.
name: dockerhub-api-test
'on':
  push:
    branches:
      - fix/dockerhub-namespace-route
permissions:
  contents: read
jobs:
  api-test:
    name: "Docker Hub API with DOCKERHUB_TOKEN${{ matrix.suffix }}"
    if: "${{ github.repository == 'webdevops/Dockerfile' }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suffix:
          - ''
          - _TEST1
          - _TEST2
    steps:
      -
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      -
        name: 'Try every way to change the description of webdevops/php'
        shell: bash
        env:
          CREDENTIALS: "DOCKERHUB_USERNAME${{ matrix.suffix }} / DOCKERHUB_TOKEN${{ matrix.suffix }}"
          HUB_USERNAME: "${{ secrets[format('DOCKERHUB_USERNAME{0}', matrix.suffix)] }}"
          HUB_TOKEN: "${{ secrets[format('DOCKERHUB_TOKEN{0}', matrix.suffix)] }}"
          REPOSITORY: webdevops/php
          REQUIRED: "${{ matrix.suffix == '' && '1' || '' }}"
        run: bash .github/dockerhub-api-test.sh
